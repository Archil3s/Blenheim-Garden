<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dense Tomato Plant 3D</title>
<style>
:root{--sky1:#8fd6ff;--sky2:#f1efdc;--panel:#fffdf6;--fg:#2b2a26;--accent:#d8402c;--soft:#efe8d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1b2c40;--sky2:#2a3524;--panel:#2a2d28;--fg:#ecebe5;--accent:#e8604d;--soft:#3a3e36}}
:root[data-theme="dark"]{--sky1:#1b2c40;--sky2:#2a3524;--panel:#2a2d28;--fg:#ecebe5;--accent:#e8604d;--soft:#3a3e36}
html,body{height:100%;margin:0}
body{background:var(--panel);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
#view{flex:1;min-height:0;touch-action:none;background:linear-gradient(var(--sky1),var(--sky2))}
canvas{display:block;width:100%;height:100%}
#ui{background:var(--panel);padding:10px 14px 12px;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
label{font-size:13px;display:flex;flex-direction:column;gap:2px}
label b{display:flex;justify-content:space-between;font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent);height:26px;margin:0}
button{padding:11px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:15px;font-weight:700}
button.off{background:var(--soft);color:var(--fg)}
</style>
</head>
<body>
<div id="view"></div>
<div id="ui">
  <label><b>Height <span id="vh"></span></b><input id="h" type="range" min="90" max="220" value="160"></label>
  <label><b>Canopy <span id="vw"></span></b><input id="w" type="range" min="40" max="90" value="75"></label>
  <label><b>Density <span id="vt"></span></b><input id="t" type="range" min="2" max="6" value="5"></label>
  <label><b>Ripeness <span id="vr"></span></b><input id="r" type="range" min="0" max="100" value="85"></label>
  <button id="plant">🍅 Plant on</button>
  <button id="spin">🔄 Spin on</button>
<button id="reset">Reset view</button><button id="export">Download GLB</button><output id="status" style="grid-column:1/-1;font-size:12px">Drag to orbit · pinch or scroll to zoom</output></div>

  const tf=flower2(r);tf.position.set(top.x,top.y+3,top.z);pg.add(tf);
  const nT=Math.max(2,Math.round(H/32));
  for(let j=0;j<nT;j++){const t=.2+.62*j/(nT-1),a=j*2.4+.9,p0=stem.getPoint(t),
      R=Math.max(16,W*.47)*(.85+.15*r()),dx=Math.cos(a),dz=Math.sin(a),V=THREE.Vector3;
    const tc=new THREE.CatmullRomCurve3([p0.clone(),p0.clone().add(new V(dx*R*.45,5,dz*R*.45)),p0.clone().add(new V(dx*R*.85,2,dz*R*.85)),p0.clone().add(new V(dx*R*1.1,-3,dz*R*1.1))]);
    pg.add(tube(tc,.55,0x4f9a3d,16));
    const nF=3+(r()*3|0);
    for(let k=0;k<nF;k++){const fp=tc.getPoint(.4+.6*k/(nF-1)),rd=(5.4+r()*1.6)*(1-.15*t),
        v=rip*1.35-t*.46+(r()-.5)*.24,f=fruit2(rd,ripe(v).getHex(),r);
      const fy=fp.y-rd*.95-2-r()*3;f.position.set(fp.x+(r()-.5)*2,fy,fp.z+(r()-.5)*2);pg.add(f);
      pg.add(tube(new THREE.LineCurve3(fp.clone(),new V(f.position.x,fy+rd*.9,f.position.z)),.35,0x4f9a3d,2))}
    const e=tc.getPoint(1);for(let q=0;q<2;q++){const fl=flower2(r);fl.position.set(e.x+dx*(3+q*4),e.y+1+q*2,e.z+dz*(3+q*4));pg.add(fl)}for(let q=0;q<3;q++){const bd=bud(r);bd.position.set(e.x+dx*(1+q*2.5)+(r()-.5)*3,e.y-1+q*.8,e.z+dz*(1+q*2.5)+(r()-.5)*3);pg.add(bd)}const tp2=tc.getPoint(.28),tfr=fruit2(2.6,0x7bb84a,r);tfr.position.set(tp2.x,tp2.y-5,tp2.z);pg.add(tfr);pg.add(tube(new THREE.LineCurve3(tp2.clone(),new V(tp2.x,tp2.y-2.3,tp2.z)),.3,0x4f9a3d,2))}
}

let yaw=.7,pitch=.4,dist=300;
const ptr=new Map();let pd=0;const pdist=()=>{const a=[...ptr.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1};
view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size==2)pd=pdist()});
view.addEventListener('pointermove',e=>{const o=ptr.get(e.pointerId);if(!o)return;
  if(ptr.size==1){yaw-=(e.clientX-o[0])*.008;pitch=Math.max(.03,Math.min(1.45,pitch+(e.clientY-o[1])*.006));ptr.set(e.pointerId,[e.clientX,e.clientY])}
  else{ptr.set(e.pointerId,[e.clientX,e.clientY]);const nd=pdist();dist=Math.max(60,Math.min(1000,dist*pd/nd));pd=nd}});
['pointerup','pointercancel'].forEach(n=>view.addEventListener(n,e=>ptr.delete(e.pointerId)));
view.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(60,Math.min(1000,dist*(1+e.deltaY*.001)))},{passive:false});
let timer;['h','w','t','r'].forEach(id=>$(id).addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{first=true;build();fit()},90)}));
$('plant').onclick=()=>{plantOn=!plantOn;$('plant').textContent='🍅 Plant '+(plantOn?'on':'off');$('plant').className=plantOn?'':'off';build()};
$('spin').onclick=()=>{spin=!spin;$('spin').textContent='🔄 Spin '+(spin?'on':'off');$('spin').className=spin?'':'off'};
function resize(){const b=view.getBoundingClientRect();ren.setSize(b.width,b.height);cam.aspect=b.width/b.height;cam.updateProjectionMatrix()}
addEventListener('resize',resize);
const up=new THREE.Vector3(0,1,0);
function loop(ms){const t=ms/1000;
  if(spin&&!ptr.size)yaw+=Math.min(.05,(ms-(loop.last||ms))/1000)*.24;loop.last=ms;
  cam.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,tgtY+Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist);
  cam.lookAt(0,tgtY,0);
  leaves.forEach(l=>l.rotation.z=l.userData.rest+Math.sin(t*.85+l.userData.ph)*.017);
  const d=cam.position.clone().sub(new THREE.Vector3(0,tgtY,0)).normalize(),rt=up.clone().cross(d).normalize();
  hls.forEach(h=>{const v=d.clone().multiplyScalar(.75).addScaledVector(up,.5).addScaledVector(rt,-.4).normalize().multiplyScalar(h.rad*.93);
    h.hl.position.copy(v);h.hl.quaternion.copy(cam.quaternion)});
  ren.render(scene,cam);requestAnimationFrame(loop)}
function fit(){dist=Math.max(+$('h').value*1.85,(+$('w').value+15)*2.4)/Math.min(1,cam.aspect);}
$('reset').onclick=()=>{yaw=.7;pitch=.4;fit()};
new ResizeObserver(()=>{resize();fit()}).observe(view);
async function exportModel(){
 const copy=root.clone(true);copy.children.filter(o=>o.userData.environment).forEach(o=>copy.remove(o));
 const strip=[];copy.traverse(o=>{if(o.material===outMat||o.material===hlMat||o.isLine)strip.push(o)});strip.forEach(o=>o.removeFromParent());
 copy.scale.setScalar(.01);copy.name='Refined botanical tomato plant';copy.userData={units:'metres',heightCm:+$('h').value,widthCm:+$('w').value,density:+$('t').value,ripeness:+$('r').value};
 copy.updateMatrixWorld(true);const plantBounds=new THREE.Box3().setFromObject(copy);copy.position.y-=plantBounds.min.y;copy.updateMatrixWorld(true);const merged=new THREE.Group();merged.name=copy.name;merged.userData=copy.userData;const batches=new Map();copy.traverse(o=>{if(!o.isMesh||!o.visible||o.material.visible===false)return;if(Array.isArray(o.material)){const m=new THREE.Mesh(o.geometry,o.material);m.applyMatrix4(o.matrixWorld);merged.add(m);return}const key=o.material.uuid;if(!batches.has(key))batches.set(key,{material:o.material,geometries:[]});let g=o.geometry.clone();if(g.index){const old=g;g=g.toNonIndexed();old.dispose()}g.applyMatrix4(o.matrixWorld);if(!g.attributes.uv)g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*2),2));for(const key of Object.keys(g.attributes))if(!['position','normal','uv'].includes(key))g.deleteAttribute(key);g.clearGroups();batches.get(key).geometries.push(g)});for(const batch of batches.values()){const g=mergeGeometries(batch.geometries);const welded=mergeVertices(g);g.dispose();batch.geometries.forEach(g=>g.dispose());merged.add(new THREE.Mesh(welded,batch.material))}try{return await new GLTFExporter().parseAsync(merged,{binary:true,onlyVisible:true})}finally{merged.traverse(o=>{if(o.geometry&&!Array.isArray(o.material))o.geometry.dispose()})}
}
$('export').onclick=async()=>{const b=$('export');b.disabled=true;$('status').textContent='Exporting textured model…';try{const data=await exportModel();const url=URL.createObjectURL(new Blob([data],{type:'model/gltf-binary'}));const a=document.createElement('a');a.href=url;a.download='tomato-refined.glb';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);$('status').textContent='GLB exported · dimensions in metres'}catch(e){$('status').textContent=e.message}finally{b.disabled=false}};
window.frameModel={export:async()=>{const data=await exportModel();let binary='';const bytes=new Uint8Array(data);for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(binary)},validate:async data=>{const gltf=await new GLTFLoader().parseAsync(data,'');const bounds=new THREE.Box3().setFromObject(gltf.scene);let meshes=0,triangles=0,textured=0;gltf.scene.traverse(o=>{if(o.isMesh){meshes++;triangles+=(o.geometry.index?.count||o.geometry.attributes.position.count)/3;if(o.material.map)textured++}});return {meshes,triangles,textured,min:bounds.min.toArray(),max:bounds.max.toArray()}},stats:()=>({geometries:ren.info.memory.geometries,textures:ren.info.memory.textures})};
resize();build();fit();requestAnimationFrame(loop);window.frameModel.ready=true;
</script>
