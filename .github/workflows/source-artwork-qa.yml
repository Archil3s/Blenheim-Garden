name: Source artwork QA
on:
  push:
    branches: [main]
    paths:
      - 'app/test-garden/**'
      - 'components/icon-test-garden.tsx'
      - 'tests/visual/test-garden-audit.spec.ts'
      - '.github/workflows/source-artwork-qa.yml'
  workflow_dispatch:

jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test tests/visual/test-garden-audit.spec.ts --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-artwork-qa-evidence
          path: |
            playwright-report/
            visual-artifacts/
          retention-days: 14
