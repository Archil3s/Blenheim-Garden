name: Apply multi-garden stability patch

on:
  push:
    branches:
      - multi-garden-stability
    paths:
      - scripts/apply-multi-garden-stability.mjs
      - .github/workflows/apply-multi-garden-stability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-garden-stability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/apply-multi-garden-stability.mjs
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add multi-garden save/load and stabilize Live 3D"
          git push origin HEAD:multi-garden-stability
