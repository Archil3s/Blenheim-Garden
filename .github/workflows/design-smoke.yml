name: Design smoke checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  design-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - name: Test homepage and seedling journal across four viewports
        run: bunx playwright test tests/visual/home-seedlings-editorial.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-smoke-evidence
          path: |
            playwright-report/
            visual-artifacts/
          retention-days: 14
