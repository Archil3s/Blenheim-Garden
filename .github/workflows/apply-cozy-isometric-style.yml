name: Apply cozy isometric garden style

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-cozy-isometric-style.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Apply cozy isometric style
        run: python scripts/apply-cozy-isometric-style.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate production build
        run: bun run build
      - name: Commit validated cozy garden style
        run: |
          rm .github/workflows/apply-cozy-isometric-style.yml
          rm scripts/apply-cozy-isometric-style.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/garden-3d-unified.tsx components/garden-crop-patch-3d.ts .github/workflows/apply-cozy-isometric-style.yml scripts/apply-cozy-isometric-style.py
          git commit -m "Match cozy isometric garden reference"
          git push
