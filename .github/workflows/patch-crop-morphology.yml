name: Patch crop morphology

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-crop-morphology.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire improved plant generator into 3D renderer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/garden-3d-unified.tsx')
          text = path.read_text()

          import_anchor = 'import { addDemonstrationBed3D } from "@/components/garden-demo-bed-3d";\n'
          new_import = 'import { createGardenPlant3D } from "@/components/garden-plant-3d";\n'
          if new_import not in text:
              if import_anchor not in text:
                  raise SystemExit('Could not find renderer import anchor')
              text = text.replace(import_anchor, import_anchor + new_import, 1)

          area_old = 'const plant = createPlant(area.crop, mobile, index + area.crop.length * 11);'
          area_new = 'const plant = createGardenPlant3D(area.crop, area.variety, mobile, index + area.crop.length * 11);'
          row_old = 'const plant = createPlant(row.crop, mobile, index + row.crop.length * 7);'
          row_new = 'const plant = createGardenPlant3D(row.crop, row.variety, mobile, index + row.crop.length * 7);'

          if area_new not in text:
              if area_old not in text:
                  raise SystemExit('Could not find planting-area plant factory call')
              text = text.replace(area_old, area_new, 1)
          if row_new not in text:
              if row_old not in text:
                  raise SystemExit('Could not find row plant factory call')
              text = text.replace(row_old, row_new, 1)

          path.write_text(text)
          Path('.github/workflows/patch-crop-morphology.yml').unlink()
          PY
      - name: Commit renderer wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/garden-3d-unified.tsx .github/workflows/patch-crop-morphology.yml
          git commit -m "Use crop-specific 3D plant morphology"
          git push
