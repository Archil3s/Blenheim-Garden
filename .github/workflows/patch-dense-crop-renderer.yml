name: Patch dense crop renderer

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-dense-crop-renderer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Patch renderer
        run: python scripts/patch-dense-crop-renderer.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate production build
        run: bun run build
      - name: Commit validated renderer
        run: |
          rm .github/workflows/patch-dense-crop-renderer.yml
          rm scripts/patch-dense-crop-renderer.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/garden-3d-unified.tsx .github/workflows/patch-dense-crop-renderer.yml scripts/patch-dense-crop-renderer.py
          git commit -m "Use dense crop patches in 3D garden"
          git push
