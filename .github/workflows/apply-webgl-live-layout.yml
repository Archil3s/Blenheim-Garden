name: Apply WebGL live layout patch

on:
  push:
    branches:
      - webgl-exact-live-layout
    paths:
      - scripts/apply-webgl-live-layout.mjs
      - .github/workflows/apply-webgl-live-layout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: webgl-exact-live-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply WebGL live layout patch
        run: node scripts/apply-webgl-live-layout.mjs
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Keep WebGL camera stable during live layout updates"
          git push origin HEAD:webgl-exact-live-layout

# One-shot workflow; the patch script removes this file after a successful run.
