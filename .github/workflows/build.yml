name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-garden-stability
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Fix selected garden insert bindings
        run: node scripts/fix-multi-garden-bindings.mjs
      - name: Commit garden isolation repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Keep all planner writes scoped to selected garden"
            git push origin HEAD:multi-garden-stability
          fi
      - run: bun install
      - run: bun run build
