name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: webgl-exact-live-layout
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Apply exact Live 3D layout patch
        run: node scripts/run-webgl-live-layout-and-clean.mjs
      - name: Commit exact Live 3D layout patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Keep WebGL camera stable during live layout updates"
            git push origin HEAD:webgl-exact-live-layout
          fi
      - run: bun install
      - run: bun run build
