name: Apply live WebGL sync

on:
  push:
    branches:
      - live-webgl-design-sync
    paths:
      - scripts/apply-live-webgl-sync.mjs
      - .github/workflows/apply-live-webgl-sync.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-webgl-design-sync
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply live sync patch
        run: node scripts/apply-live-webgl-sync.mjs
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Make WebGL mirror planner changes in real time"
          git push origin HEAD:live-webgl-design-sync
